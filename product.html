<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details – MarketHub</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

<nav class="navbar">
    <div class="logo"><i class="fas fa-store"></i> MarketHub</div>
    <div class="nav-links">
        <a href="index.html" class="nav-link"><i class="fas fa-home"></i> Shop</a>
        <a href="cart.html" class="nav-link"><i class="fas fa-shopping-cart"></i> Cart <span id="cartNavCount" class="cart-count">0</span></a>
        <a href="myorders.html" class="nav-link"><i class="fas fa-list-ul"></i> My Orders</a>
        <div id="userInfoArea" style="display: flex;"><span id="userGreeting" class="user-greeting"></span><button id="logoutBtn" class="nav-link logout-btn">Logout</button></div>
    </div>
</nav>

<div class="container product-detail-container">
    <div id="productDetail" class="product-detail">
        <div class="product-gallery">
            <div class="main-image">
                <img id="mainProductImage" src="" alt="Product Image">
            </div>
            <div id="thumbnailList" class="thumbnail-list"></div>
        </div>
        <div class="product-info-detail">
            <h1 id="productName"></h1>
            <div class="product-price-detail" id="productPrice"></div>
            <div class="product-description-full" id="productDescription"></div>
            <button id="detailAddToCartBtn" class="add-cart-btn"><i class="fas fa-cart-plus"></i> Add to Cart</button>
        </div>
    </div>
    <div id="productNotFound" style="display:none; text-align:center; padding:2rem;">Product not found.</div>
    
    <!-- Similar Products Section -->
    <div class="similar-products-section">
        <h3><i class="fas fa-tachometer-alt"></i> More Equipment You May Like</h3>
        <div id="similarProductsContainer" class="similar-products-grid"></div>
    </div>
</div>

<script type="module" src="script.js"></script>
</body>
</html>
